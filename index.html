<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stackyard Warehouse Ops</title>
<meta name="description" content="A 3D warehouse control room in the browser: a simulated distribution center with AGV forklifts, live KPIs, SKU search and a task queue.">
<meta name="theme-color" content="#0e151d">
<meta property="og:type" content="website">
<meta property="og:title" content="Stackyard Warehouse Ops">
<meta property="og:description" content="A 3D warehouse control room in the browser: a simulated distribution center with AGV forklifts, live KPIs, SKU search and a task queue.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%230e151d%22/%3E%3Crect%20x%3D%2212%22%20y%3D%2234%22%20width%3D%2240%22%20height%3D%228%22%20rx%3D%222%22%20fill%3D%22%23f5b301%22/%3E%3Crect%20x%3D%2212%22%20y%3D%2218%22%20width%3D%2240%22%20height%3D%228%22%20rx%3D%222%22%20fill%3D%22%232f6fd6%22/%3E%3Crect%20x%3D%2212%22%20y%3D%2248%22%20width%3D%2240%22%20height%3D%224%22%20rx%3D%221%22%20fill%3D%22%2393a5b6%22/%3E%3C/svg%3E">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed 3D warehouse floor; the HUD docks to the edges like a control-room overlay.
   KPIs across the top, fleet + task queue on the left, inspector + floor plan on the right, controls at the bottom. */
:root{
  --night:#0e151d;        /* scene + page ground: blue-steel night shift */
  --deck:#162230;         /* control surfaces */
  --panel:rgba(13,20,28,.86);
  --line:#263545;
  --line-2:#33475a;
  --ink:#e8eef3;
  --muted:#93a5b6;
  --dim:#66798c;
  --safety:#f5b301;       /* floor-marking safety yellow: the one accent */
  --safety-ink:#1b1400;
  --rack:#2f6fd6;         /* pallet-rack upright blue */
  --put-ink:#8fb6ff;
  --ok:#3ccf8e;
  --warn:#ff9f1c;
  --crit:#ef5350;
  --hazard-dark:#15181b;
  --sel:#203449;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--night);color:var(--ink);font-family:var(--body);font-size:13px;overflow:hidden;-webkit-font-smoothing:antialiased}
#app{position:relative;height:100%;overflow:hidden}
#stage{position:absolute;inset:0;touch-action:none}
#stage canvas{display:block}
.labels{position:absolute;inset:0;pointer-events:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.hud{position:absolute;z-index:3}
.glass{background:var(--panel);border:1px solid var(--line);border-radius:8px;backdrop-filter:blur(10px) saturate(1.15);-webkit-backdrop-filter:blur(10px) saturate(1.15);box-shadow:0 12px 32px rgba(0,0,0,.35)}

/* ---------- top bar */
.topbar{top:12px;left:16px;right:16px;display:flex;gap:10px;align-items:stretch}
.brand{display:flex;align-items:center;gap:12px;padding:8px 14px 8px 8px;flex:none}
.hazard{width:10px;align-self:stretch;border-radius:3px;background:repeating-linear-gradient(-45deg,var(--safety) 0 6px,var(--hazard-dark) 6px 12px)}
.brand-name{font:800 23px/1 var(--display);letter-spacing:.07em}
.brand-sub{font:500 11px/1.35 var(--body);color:var(--muted)}
.sim-chip{display:inline-block;font:600 9px/1 var(--mono);letter-spacing:.1em;color:var(--safety);border:1px solid rgba(245,179,1,.45);border-radius:3px;padding:2px 4px;margin-left:4px;vertical-align:1px}
.clock{display:flex;flex-direction:column;align-items:flex-end;gap:3px;padding-left:12px;border-left:1px solid var(--line)}
#clock{font:700 24px/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:.04em}
#simState{font:600 10px/1 var(--mono);color:var(--muted);letter-spacing:.08em}
#simState.live{color:var(--ok)}
.kpis{display:flex;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.kpis::-webkit-scrollbar{display:none}
.kpi{display:flex;flex-direction:column;justify-content:center;gap:3px;padding:8px 16px;border-left:1px solid var(--line);min-width:124px;flex:1}
.kpi:first-child{border-left:0}
.k-label{font:600 10px/1.2 var(--body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);white-space:nowrap}
.k-val{font:700 27px/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.k-sub{font:500 10.5px/1.2 var(--mono);color:var(--dim);white-space:nowrap}
.k-bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.k-bar i{display:block;height:100%;width:0;background:var(--safety);transition:width .4s,background .4s}
.search{display:flex;align-items:center;padding:4px;gap:4px;flex:0 1 270px;min-width:0}
.search:focus-within{border-color:var(--safety)}
.search input{flex:1;min-width:0;background:transparent;border:0;color:var(--ink);font:500 13px var(--body);padding:8px;outline:none}
.search input::placeholder{color:var(--dim)}

button{font:600 12px/1 var(--body);color:var(--ink);background:var(--deck);border:1px solid var(--line-2);border-radius:6px;padding:8px 11px;cursor:pointer;white-space:nowrap;transition:border-color .15s,background .15s}
button:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible,.row:focus-visible{outline:2px solid var(--safety);outline-offset:2px}
button.primary{background:var(--safety);color:var(--safety-ink);border-color:var(--safety)}
button.primary:hover{filter:brightness(1.08)}
button[disabled]{opacity:.45;cursor:not-allowed}

/* ---------- side panels */
.panel{top:96px;bottom:76px;width:292px;display:flex;flex-direction:column;overflow:hidden}
.left{left:16px}
.panel section{padding:12px 14px;border-top:1px solid var(--line);min-height:0}
.panel section:first-child{border-top:0}
.panel h2{font:700 15px/1 var(--display);letter-spacing:.09em;text-transform:uppercase;margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.count{font:500 11px var(--mono);color:var(--dim);letter-spacing:0;text-transform:none}
.sec-tasks{flex:1;display:flex;flex-direction:column}
.sec-tasks ul{overflow:auto;flex:1;min-height:0}
.sec-log{flex:0 0 auto;max-height:190px;display:flex;flex-direction:column}
.sec-log ol{overflow:auto;min-height:0}
ul,ol{list-style:none;margin:0;padding:0}
.row{width:100%;display:grid;align-items:center;text-align:left;background:transparent;border:1px solid transparent;border-radius:6px;padding:6px 6px;font:500 12px/1.25 var(--body);color:var(--ink);cursor:pointer}
.row:hover{background:rgba(255,255,255,.04);border-color:var(--line)}
.row.on{background:var(--sel);border-color:var(--rack)}
.fleet .row{grid-template-columns:10px 58px 1fr 46px 30px;gap:8px}
.dot{width:10px;height:10px;border-radius:3px;background:var(--c)}
.rname{font:600 12px var(--mono)}
.rstat{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rstat.s-move{color:var(--safety)} .rstat.s-lift{color:var(--put-ink)} .rstat.s-wait{color:var(--crit)} .rstat.s-idle{color:var(--ok)}
.batt{height:6px;border-radius:2px;background:var(--line);overflow:hidden}
.batt i{display:block;height:100%;background:var(--ok)}
.batt.low i{background:var(--crit)}
.bpct{font:500 10.5px var(--mono);color:var(--dim);text-align:right;font-variant-numeric:tabular-nums}
.tasks .row{grid-template-columns:54px 1fr;gap:2px 8px}
.chip{font:600 9.5px/1 var(--mono);padding:4px 0;border-radius:3px;letter-spacing:.06em;text-align:center;grid-row:span 2}
.chip.pick{background:rgba(245,179,1,.15);color:var(--safety)}
.chip.put{background:rgba(47,111,214,.22);color:var(--put-ink)}
.t-main{font:600 12px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-main span{color:var(--muted);font-weight:500}
.t-sub{font:500 11px var(--body);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-sub b{font-weight:600;color:var(--muted)}
.more{font:500 11px var(--mono);color:var(--dim);padding:6px}
.log li{display:grid;grid-template-columns:40px 1fr;gap:8px;padding:4px 0;font:400 11.5px/1.35 var(--body);color:var(--muted);border-top:1px dashed var(--line)}
.log li:first-child{border-top:0}
.log time{font:500 11px var(--mono);color:var(--dim);font-variant-numeric:tabular-nums}
.log li.pick span::before,.log li.put span::before,.log li.ship span::before,.log li.warn span::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;vertical-align:1px}
.log li.pick span::before{background:var(--safety)} .log li.put span::before{background:var(--rack)} .log li.ship span::before{background:var(--ok)} .log li.warn span::before{background:var(--crit)}

/* ---------- inspector */
.right{right:16px;top:96px;width:300px;max-height:calc(100% - 96px - 76px - 172px);overflow:auto;padding:14px 16px 16px}
.eyebrow{font:600 10px/1.2 var(--body);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.insp-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.loc{font:800 38px/1 var(--display);letter-spacing:.04em;margin:4px 0 2px}
.insp-title{font:700 22px/1.1 var(--display);letter-spacing:.03em;margin:4px 0 6px;text-wrap:balance}
.close{padding:6px 9px;font-size:14px;line-height:1}
.loc-break{font:500 11px var(--mono);color:var(--dim);margin-bottom:12px}
.hint{color:var(--muted);line-height:1.5;margin:0 0 14px;max-width:34ch}
.sku-card{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--deck);margin-bottom:12px}
.swatch{width:34px;height:34px;border-radius:4px;background:var(--sw);box-shadow:inset 0 -6px 0 rgba(0,0,0,.18)}
.pname{font:600 14px/1.25 var(--body)}
.sku{font:500 11px var(--mono);color:var(--muted);margin-top:2px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;margin:0 0 14px}
.facts div{min-width:0}
.facts dt{font:600 10px/1.2 var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin-bottom:3px}
.facts dd{margin:0;font:600 15px/1.2 var(--body);font-variant-numeric:tabular-nums}
.facts dd small{font:500 11px var(--body);color:var(--muted)}
.abc{display:inline-block;font:700 11px/1 var(--mono);padding:3px 5px;border-radius:3px;color:#10151a;margin-right:4px;vertical-align:1px}
.note{font:500 12px/1.4 var(--body);color:var(--safety);background:rgba(245,179,1,.08);border:1px solid rgba(245,179,1,.28);border-radius:6px;padding:8px 10px;margin-bottom:12px}
.note.blue{color:var(--put-ink);background:rgba(47,111,214,.12);border-color:rgba(47,111,214,.4)}
.empty-bin{border:1px dashed var(--line-2);border-radius:6px;padding:14px;text-align:center;color:var(--muted);margin-bottom:12px;font-size:12.5px}
.empty-bin b{display:block;font:700 17px/1.2 var(--display);letter-spacing:.05em;color:var(--ink);margin-bottom:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.bigbatt{height:8px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.bigbatt i{display:block;height:100%;background:var(--ok)}
.legend{display:grid;gap:6px;margin:6px 0 14px}
.legend div{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink)}
.legend i{width:14px;height:14px;border-radius:3px;background:var(--sw);flex:none}
.legend small{color:var(--dim);font:500 11px var(--mono);margin-left:auto}
.ramp{height:10px;border-radius:3px;background:linear-gradient(90deg,#46d39a,#f5b301 40%,#ef5350);margin:8px 0 4px}
.ramp-l{display:flex;justify-content:space-between;font:500 10.5px var(--mono);color:var(--dim);margin-bottom:14px}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:11.5px;color:var(--muted);padding-top:12px;border-top:1px solid var(--line)}
kbd{font:600 10px var(--mono);color:var(--ink);background:var(--deck);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:2px 5px;margin-right:4px}
.codehelp{font:500 11px/1.5 var(--mono);color:var(--dim);margin:0 0 12px}
.codehelp b{color:var(--safety);font-weight:600}

/* ---------- minimap */
.minimap{right:16px;bottom:76px;width:300px;padding:8px 10px 10px}
.mm-head{display:flex;justify-content:space-between;font:600 10px/1 var(--body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-bottom:7px}
.mm-head span:last-child{font:500 10px var(--mono);color:var(--dim);letter-spacing:0;text-transform:none}
#minimap{display:block;width:100%;aspect-ratio:64/40;border-radius:4px;cursor:crosshair;max-width:100%}

/* ---------- toolbar */
.toolbar{left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;padding:6px;max-width:calc(100% - 32px);overflow-x:auto;scrollbar-width:none}
.toolbar::-webkit-scrollbar{display:none}
.seg{display:flex;align-items:center;gap:2px;padding:3px;border-radius:7px;background:var(--deck);border:1px solid var(--line)}
.seg-label{font:600 9.5px/1 var(--body);text-transform:uppercase;letter-spacing:.1em;color:var(--dim);padding:0 6px 0 5px}
.seg button{border:0;background:transparent;padding:7px 10px;color:var(--muted);border-radius:5px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--line-2);color:var(--ink)}
#btnPause[aria-pressed="true"]{background:var(--safety);color:var(--safety-ink)}
#btnAuto[aria-pressed="true"]{border-color:var(--ok);color:var(--ok)}
.mobile-only{display:none}

/* ---------- floating bits */
.tip{position:absolute;z-index:6;pointer-events:none;background:rgba(10,15,21,.94);border:1px solid var(--line-2);border-radius:5px;padding:6px 8px;font:500 11.5px/1.35 var(--body);color:var(--ink);white-space:nowrap;transform:translate(14px,14px)}
.tip b{font:600 12px var(--mono);color:var(--safety);margin-right:6px}
.toast{left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom,0px));padding:9px 14px;font:500 12.5px var(--body);border-color:var(--line-2);z-index:7;max-width:calc(100% - 32px);text-align:center}
.tag{font:600 10.5px/1 var(--mono);color:var(--ink);background:rgba(10,15,21,.84);border:1px solid var(--line-2);border-left:3px solid var(--c);border-radius:4px;padding:4px 6px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tag span{font-weight:500;color:var(--muted)}
.tag.carry span{color:var(--safety)}

/* ---------- responsive */
@media (max-width:1180px){
  .minimap{display:none}
  .right{max-height:calc(100% - 96px - 76px)}
  .panel.left{width:260px}
  .right{width:272px}
}
@media (max-width:760px){
  .topbar{flex-wrap:wrap;gap:8px}
  .brand{flex:1 1 auto;min-width:0;padding:6px 10px 6px 6px}
  .brand-sub{display:none}
  .search{flex:1 1 100%;order:3}
  .kpis{flex:1 1 100%;order:2}
  .kpi{min-width:110px;padding:6px 12px}
  .k-val{font-size:22px}
  .panel.left{display:none;top:170px;width:auto;right:16px}
  .panel.left.open{display:flex}
  .right{top:auto;left:16px;right:16px;width:auto;bottom:calc(70px + env(safe-area-inset-bottom,0px));max-height:44%}
  .right.empty{display:none}
  .toolbar{left:16px;right:16px;transform:none;max-width:none}
  .mobile-only{display:inline-flex}
  .hide-narrow{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="stage" aria-label="3D view of the warehouse floor"></div>

  <header class="hud topbar">
    <div class="brand glass">
      <div class="hazard" aria-hidden="true"></div>
      <div>
        <div class="brand-name">STACKYARD</div>
        <div class="brand-sub">DC-02 Northgate · <span id="shift">Day shift</span><span class="sim-chip">SIMULATION</span></div>
      </div>
      <div class="clock"><span id="clock">10:40</span><span id="simState" class="live">LIVE ×1</span></div>
    </div>
    <div class="kpis glass" aria-label="Key figures">
      <div class="kpi"><span class="k-label">Bin utilization</span><span class="k-val" id="kUtil">–</span><span class="k-bar"><i id="kUtilBar"></i></span></div>
      <div class="kpi"><span class="k-label">Pallets on hand</span><span class="k-val" id="kOnHand">–</span><span class="k-sub">of 144 positions</span></div>
      <div class="kpi"><span class="k-label">Shipped today</span><span class="k-val" id="kShipped">–</span><span class="k-sub" id="kRate">–</span></div>
      <div class="kpi"><span class="k-label">Received today</span><span class="k-val" id="kRecv">–</span><span class="k-sub" id="kInbound">–</span></div>
      <div class="kpi"><span class="k-label">Open tasks</span><span class="k-val" id="kTasks">–</span><span class="k-sub" id="kTasksSub">–</span></div>
    </div>
    <form class="search glass" id="searchForm" role="search">
      <label for="q" class="sr">Find a SKU or product</label>
      <input id="q" list="skuList" placeholder="Find SKU or product" autocomplete="off">
      <datalist id="skuList"></datalist>
      <button type="submit" class="primary">Locate</button>
    </form>
  </header>

  <aside class="hud panel left glass" id="opsPanel" aria-label="Fleet and tasks">
    <section>
      <h2>Fleet <span class="count" id="fleetCount">4 AGVs</span></h2>
      <ul class="fleet" id="fleetList"></ul>
    </section>
    <section class="sec-tasks">
      <h2>Task queue <span class="count" id="queueCount"></span></h2>
      <ul class="tasks" id="taskList"></ul>
    </section>
    <section class="sec-log">
      <h2>Activity</h2>
      <ol class="log" id="logList" aria-live="off"></ol>
    </section>
  </aside>

  <aside class="hud panel right glass empty" id="inspector" aria-live="polite"></aside>

  <div class="hud minimap glass">
    <div class="mm-head"><span>Floor plan</span><span>64 × 40 m · click to jump</span></div>
    <canvas id="minimap" width="280" height="175" aria-label="Floor plan minimap"></canvas>
  </div>

  <div class="hud toolbar glass" role="toolbar" aria-label="View and simulation controls">
    <button class="mobile-only" id="btnPanel" aria-pressed="false">Fleet</button>
    <div class="seg" id="modeSeg" aria-label="Color pallets by">
      <span class="seg-label">Color</span>
      <button data-mode="category" aria-pressed="true">Category</button>
      <button data-mode="velocity" aria-pressed="false">Velocity</button>
      <button data-mode="age" aria-pressed="false">Age</button>
    </div>
    <div class="seg" id="camSeg" aria-label="Camera">
      <span class="seg-label">View</span>
      <button data-cam="iso" aria-pressed="true">Iso</button>
      <button data-cam="top" aria-pressed="false">Top</button>
      <button data-cam="follow" aria-pressed="false">Follow</button>
    </div>
    <div class="seg" id="simSeg" aria-label="Simulation speed">
      <button id="btnPause" aria-pressed="false" title="Pause (Space)">Pause</button>
      <button data-speed="1" aria-pressed="true">×1</button>
      <button data-speed="2" aria-pressed="false">×2</button>
      <button data-speed="4" aria-pressed="false">×4</button>
    </div>
    <button id="btnAuto" aria-pressed="true">Auto orders</button>
    <button id="btnOrder" class="primary">New order</button>
    <button id="btnTruck">Receive truck</button>
  </div>

  <div class="tip" id="tip" hidden></div>
  <div class="hud toast glass" id="toast" role="status" hidden></div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);

function ageColor(d) {

const fmtClock = m => { const d = ((m % 1440) + 1440) % 1440; return `${String(Math.floor(d / 60)).padStart(2, '0')}:${String(Math.floor(d % 60)).padStart(2, '0')}`; };
let toastTimer = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; toastTimer = 3.2; }
const cache = {};
function setHTML(id, html) { if (cache[id] !== html) { cache[id] = html; document.getElementById(id).innerHTML = html; } }
function setText(id, txt) { if (cache[id] !== txt) { cache[id] = txt; document.getElementById(id).textContent = txt; } }

function legendHTML() {
  let leg = '';
  if (mode === 'category') leg = `<div class="eyebrow">Color · product category</div><div class="legend">${Object.entries(CATS).map(([k, c]) => `<div><i style="--sw:${c.color}"></i>${c.name}<small>${bins.filter(b => b.load && b.load.product.cat === k).length}</small></div>`).join('')}</div>`;
  else if (mode === 'velocity') leg = `<div class="eyebrow">Color · ABC velocity class</div><div class="legend">${Object.entries(ABC).map(([k, c]) => `<div><i style="--sw:${c.color}"></i><b>${k}</b>&nbsp;${c.label}<small>${bins.filter(b => b.load && b.load.product.abc === k).length}</small></div>`).join('')}</div>`;
  else leg = `<div class="eyebrow">Color · days on hand</div><div class="ramp"></div><div class="ramp-l"><span>0 d</span><span>10 d</span><span>25 d+</span></div>`;
  return `<div class="eyebrow">Inspector</div><h3 class="insp-title">Select a pallet or AGV</h3>
  <p class="hint">Click any rack position to see what is stored there, or search a SKU above to locate its oldest pallet.</p>${leg}
  <p class="codehelp">Location codes read aisle-bay-level + face.<br><b>B-04-2L</b> = aisle B, bay 04, level 2, left face.</p>
  <div class="keys"><span><kbd>Drag</kbd>orbit</span><span><kbd>Right-drag</kbd>pan</span><span><kbd>Scroll</kbd>zoom</span><span><kbd>F</kbd>follow AGV</span><span><kbd>Space</kbd>pause</span><span><kbd>Esc</kbd>deselect</span></div>`;
}
function binHTML(b) {
  let h = `<div class="insp-head"><div><div class="eyebrow">Rack location</div><div class="loc">${b.id}</div></div><button class="close" data-act="close" aria-label="Close inspector">×</button></div><div class="loc-break">${binTitle(b)}</div>`;
  const t = b.task;
  if (b.load) {
    const l = b.load, p = l.product, d = ageDays(l);
    h += `<div class="sku-card"><span class="swatch" style="--sw:${CATS[p.cat].color}"></span><div><div class="pname">${esc(p.name)}</div><div class="sku">${p.sku} · ${CATS[p.cat].name}</div></div></div>
    <dl class="facts"><div><dt>Cases</dt><dd>${l.cases} <small>/ ${p.cpp}</small></dd></div><div><dt>Velocity</dt><dd><span class="abc" style="background:${ABC[p.abc].color}">${p.abc}</span><small>${ABC[p.abc].label}</small></dd></div>
    <div><dt>Days on hand</dt><dd>${d.toFixed(1)} <small>d</small></dd></div><div><dt>Received</dt><dd>${d < 1 ? 'Today' : Math.floor(d) + ' d ago'} <small>${fmtClock(l.received)}</small></dd></div></dl>`;
    if (t && t.type === 'PICK') h += `<div class="note">${t.ref} · ${esc(t.status)}${t.robot ? ' · ' + t.robot.name : ''}</div>`;
    h += `<div class="actions"><button class="primary" data-act="pick" ${b.reserved ? 'disabled' : ''}>Pick to shipping</button>${t && t.robot ? `<button data-act="followtask">Follow ${t.robot.name}</button>` : ''}</div>`;
  } else {
    h += `<div class="empty-bin"><b>Empty position</b>Beam load limit 1,000 kg · max height 1.6 m</div>`;
    if (t && t.type === 'PUTAWAY') h += `<div class="note blue">Reserved for ${t.ref} · ${esc(t.product.name)} · ${esc(t.status)}</div>`;
    h += `<div class="actions"><button class="primary" data-act="slot" ${b.reserved ? 'disabled' : ''}>Receive a pallet into this slot</button>${t && t.robot ? `<button data-act="followtask">Follow ${t.robot.name}</button>` : ''}</div>`;
  }
  return h;
}
function robotHTML(r) {
  const [st] = robotStatus(r), t = r.task, b = Math.round(r.battery);
  let route = '—';
  if (t) route = t.type === 'PICK' ? `${t.bin.id} → ${t.dock ? 'dock ' + t.dock.door : 'shipping'}` : `Inbound ${t.ref} → ${t.bin.id}`;
  return `<div class="insp-head"><div><div class="eyebrow">Autonomous forklift</div><div class="loc" style="color:${r.color}">${r.name}</div></div><button class="close" data-act="close" aria-label="Close inspector">×</button></div>
  <div class="loc-break">${following === r ? 'Camera following · ' : ''}${st}</div>
  ${t ? `<div class="note ${t.type === 'PICK' ? '' : 'blue'}">${t.ref} · ${esc(t.product.name)}<br>${route}</div>` : ''}
  <dl class="facts"><div><dt>Battery</dt><dd>${b}<small>%</small><div class="bigbatt"><i style="width:${b}%;background:${b < 25 ? 'var(--crit)' : 'var(--ok)'}"></i></div></dd></div>
  <div><dt>Tasks this shift</dt><dd>${r.done}</dd></div><div><dt>Distance</dt><dd>${(r.odo / 1000).toFixed(2)} <small>km</small></dd></div><div><dt>Carrying</dt><dd>${r.cargo ? esc(r.cargo.product.sku) : '<small>Nothing</small>'}</dd></div></dl>
  <div class="actions"><button class="primary" data-act="${following === r ? 'unfollow' : 'follow'}">${following === r ? 'Stop following' : 'Follow with camera'}</button></div>`;
}
function refreshUI(force) {
  const occ = bins.filter(b => b.load).length, util = occ / bins.length;
  setText('kUtil', Math.round(util * 100) + '%');
  const bar = $('#kUtilBar'); bar.style.width = (util * 100).toFixed(1) + '%'; bar.style.background = util > .88 ? 'var(--crit)' : util > .8 ? 'var(--warn)' : 'var(--safety)';
  setText('kOnHand', String(occ)); setText('kShipped', String(shipped));
  setText('kRate', `${shipTimes.filter(t => t > simMin - 60).length} pallets / hr`);
  setText('kRecv', String(received)); setText('kInbound', `${recvSpots.filter(s => s.load).length} at inbound dock`);
  const active = tasks.filter(t => t.robot).length;
  setText('kTasks', String(tasks.length)); setText('kTasksSub', `${active} active · ${tasks.length - active} queued`);
  setText('clock', fmtClock(simMin));
  const hr = Math.floor(((simMin % 1440) + 1440) % 1440 / 60);
  setText('shift', hr >= 6 && hr < 14 ? 'Day shift' : hr >= 14 && hr < 22 ? 'Swing shift' : 'Night shift');
  const ss = $('#simState'); ss.textContent = paused ? 'PAUSED' : `LIVE ×${speed}`; ss.classList.toggle('live', !paused);
  const avgB = Math.round(robots.reduce((s, r) => s + r.battery, 0) / robots.length);
  setText('fleetCount', `${robots.length} AGVs · avg ${avgB}%`);
  setHTML('fleetList', robots.map(r => {
    const [st, k] = robotStatus(r), b = Math.round(r.battery);
    return `<li><button class="row ${sel && sel.r === r ? 'on' : ''}" data-robot="${r.i}"><span class="dot" style="--c:${r.color}"></span><span class="rname">${r.name}</span><span class="rstat s-${k}">${st}</span><span class="batt ${b < 25 ? 'low' : ''}"><i style="width:${b}%"></i></span><span class="bpct">${b}%</span></button></li>`;
  }).join(''));
  const order = [...tasks].sort((a, b) => (b.robot ? 1 : 0) - (a.robot ? 1 : 0) || a.id - b.id);
  setText('queueCount', `${tasks.length} open`);
  setHTML('taskList', order.slice(0, 9).map(t => {
    const to = t.type === 'PICK' ? (t.dock ? t.dock.door : 'Ship') : t.bin.id, from = t.type === 'PICK' ? t.bin.id : 'Inbound';
    const on = sel && sel.type === 'bin' && sel.bin === t.bin;
    return `<li><button class="row ${on ? 'on' : ''}" data-task="${t.id}"><span class="chip ${t.type === 'PICK' ? 'pick' : 'put'}">${t.type === 'PICK' ? 'PICK' : 'PUT'}</span><span class="t-main">${t.ref} <span>${from} → ${to}</span></span><span class="t-sub">${t.robot ? `<b>${t.robot.name}</b> · ` : ''}${esc(t.status)} · ${esc(t.product.name)}</span></button></li>`;
  }).join('') + (order.length > 9 ? `<li class="more">+${order.length - 9} more queued</li>` : '') + (order.length ? '' : `<li class="more">No open tasks. Release an order with New order.</li>`));
  if (cache.logVer !== logVer) { cache.logVer = logVer; $('#logList').innerHTML = logs.slice(0, 14).map(l => `<li class="${l.kind}"><time>${fmtClock(l.t)}</time><span>${esc(l.text)}</span></li>`).join(''); }
  const insp = $('#inspector');
  insp.classList.toggle('empty', !sel);
  setHTML('inspector', !sel ? legendHTML() : sel.type === 'bin' ? binHTML(sel.bin) : robotHTML(sel.r));
  robots.forEach(r => {
    const [st] = robotStatus(r), txt = r.cargo ? `${st} · ${r.cargo.product.sku}` : st;
    if (r.tagSpan.textContent !== txt) r.tagSpan.textContent = txt;
    r.tagEl.classList.toggle('carry', !!r.cargo);
  });
}

/* ---------- controls wiring */
$('#modeSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  mode = b.dataset.mode; document.querySelectorAll('#modeSeg button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  recolorAll(); refreshUI(true);
});
$('#camSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.cam === 'follow') { const next = robots[(following ? following.i + 1 : 0) % robots.length]; sel = { type: 'robot', r: next }; startFollow(next); refreshUI(true); }
  else camPreset(b.dataset.cam);
});
function setPaused(p) { paused = p; const b = $('#btnPause'); b.setAttribute('aria-pressed', String(p)); b.textContent = p ? 'Resume' : 'Pause'; refreshUI(true); }
$('#simSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'btnPause') { setPaused(!paused); return; }
  speed = +b.dataset.speed; document.querySelectorAll('#simSeg [data-speed]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  if (paused) setPaused(false); else refreshUI(true);
});
$('#btnAuto').addEventListener('click', e => { autoOn = !autoOn; e.currentTarget.setAttribute('aria-pressed', String(autoOn)); toast(autoOn ? 'Auto orders on. Orders and trucks arrive on their own.' : 'Auto orders off. Release work with New order and Receive truck.'); });
$('#btnOrder').addEventListener('click', () => { const t = createPick(); if (t) { toast(`${t.ref} released · ${t.product.name} from ${t.bin.id}`); refreshUI(true); } else toast('No pallets free to pick right now.'); });
$('#btnTruck').addEventListener('click', () => { const s = receiveTruck(randi(3, 5)); if (s.length) toast(`${s[0].asn} unloaded · ${s.length} pallets queued for putaway`); refreshUI(true); });
$('#btnPanel').addEventListener('click', e => { const p = $('#opsPanel'), open = !p.classList.contains('open'); p.classList.toggle('open', open); e.currentTarget.setAttribute('aria-pressed', String(open)); });
$('#opsPanel').addEventListener('click', e => {
  const rb = e.target.closest('[data-robot]'); if (rb) { selectRobot(robots[+rb.dataset.robot]); return; }
  const tb = e.target.closest('[data-task]'); if (tb) { const t = tasks.find(x => x.id === +tb.dataset.task); if (t) selectBin(t.bin); }
});
$('#inspector').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (act === 'close') { if (following && sel && sel.type === 'robot') following = null; clearSel(); setCamPressed(''); }
  else if (act === 'pick' && sel.type === 'bin') { const t = createPick(sel.bin); if (t) toast(`${t.ref} released from ${sel.bin.id}`); refreshUI(true); }
  else if (act === 'slot' && sel.type === 'bin') {
    const bin = sel.bin, p = chooseProductFor(bin);
    const s = receiveTruck(1, p);
    if (s.length) { createPutaway(s[0], bin); toast(`${s[0].asn} · ${p.name} routed to ${bin.id}`); }
    refreshUI(true);
  }
  else if (act === 'followtask' && sel.type === 'bin' && sel.bin.task && sel.bin.task.robot) selectRobot(sel.bin.task.robot);
  else if (act === 'follow' && sel.type === 'robot') { startFollow(sel.r); refreshUI(true); }
  else if (act === 'unfollow') { following = null; setCamPressed(''); refreshUI(true); }
});
function chooseProductFor(bin) {
  const want = bin.level === 1 ? 'A' : bin.level === 2 ? 'B' : 'C';
  return pickOne(PRODUCTS.filter(p => p.abc === want));
}
$('#skuList').innerHTML = PRODUCTS.map(p => `<option value="${p.sku} · ${esc(p.name)}"></option>`).join('');
$('#searchForm').addEventListener('submit', e => {
  e.preventDefault();
  const q = $('#q').value.trim().toLowerCase(); if (!q) return;
  const code = q.split('·')[0].trim();
  const prod = PRODUCTS.find(p => p.sku.toLowerCase() === code) || PRODUCTS.find(p => p.name.toLowerCase().includes(q) || q.includes(p.name.toLowerCase())) || PRODUCTS.find(p => p.sku.toLowerCase().startsWith(code));
  if (!prod) { toast(`No SKU or product matches "${$('#q').value.trim()}".`); return; }
  const found = bins.filter(b => b.load && b.load.product === prod).sort((a, b) => a.load.received - b.load.received);
  if (!found.length) { toast(`${prod.sku} ${prod.name} has no pallets on hand.`); return; }
  selectBin(found[0]);
  toast(`${found.length} pallet${found.length > 1 ? 's' : ''} of ${prod.name} on hand · showing the oldest (FIFO) at ${found[0].id}`);
  $('#q').blur();
});
addEventListener('keydown', e => {
  if (e.target.closest('input')) { if (e.key === 'Escape') e.target.blur(); return; }
  if (e.key === ' ' && !e.target.closest('button')) { e.preventDefault(); setPaused(!paused); }
  else if (e.key === 'Escape') { following = null; setCamPressed(''); clearSel(); }
  else if (e.key === 'f' || e.key === 'F') $('#camSeg [data-cam="follow"]').click();
  else if (e.key === '1') camPreset('iso');
  else if (e.key === '2') camPreset('top');
  else if (e.key === '/') { e.preventDefault(); $('#q').focus(); }
});

/* ---------- minimap */
const mm = $('#minimap'), mg = mm.getContext('2d');
function sizeMinimap() { const w = mm.clientWidth || 280, d = Math.min(devicePixelRatio, 2); mm.width = Math.round(w * d); mm.height = Math.round(w * 40 / 64 * d); }
function drawMinimap() {
  if (!mm.offsetParent) return;
  const W = mm.width, H = mm.height, X = x => (x + 32) / 64 * W, Z = z => (z + 20) / 40 * H, sx = W / 64;
  mg.fillStyle = '#18222c'; mg.fillRect(0, 0, W, H);
  mg.strokeStyle = 'rgba(245,179,1,.55)'; mg.lineWidth = Math.max(1, sx * .12);
  mg.strokeRect(X(-29.6), Z(-9.2), 6.9 * sx, 18.4 * sx); mg.strokeRect(X(23.7), Z(-10.3), 7.4 * sx, 20.6 * sx);
  mg.fillStyle = 'rgba(245,179,1,.12)'; for (const cz of CORR) mg.fillRect(X(-29), Z(cz - 1.5), 59.6 * sx, 3 * sx);
  const occ = new Map();
  bins.forEach(b => { const k = `${b.ai}${b.side}${b.bay}`; occ.set(k, (occ.get(k) || 0) + (b.load ? 1 : 0)); });
  bins.forEach(b => {
    if (b.level !== 1) return;
    const n = occ.get(`${b.ai}${b.side}${b.bay}`);
    mg.fillStyle = `rgba(47,111,214,${.25 + n * .2})`;
    mg.fillRect(X(b.x - .65), Z(b.z - 1.25), 1.3 * sx, 2.4 * sx);
  });
  if (sel && sel.type === 'bin') { mg.strokeStyle = '#f5b301'; mg.lineWidth = 2; mg.strokeRect(X(sel.bin.x - .8), Z(sel.bin.z - 1.4), 1.6 * sx, 2.8 * sx); }
  mg.fillStyle = '#c8a07a';
  recvSpots.forEach(s => s.load && mg.fillRect(X(RECV_X - .5), Z(s.z - .6), sx, 1.2 * sx));
  dockSpots.forEach(s => s.load && mg.fillRect(X(s.load.mesh.position.x - .5), Z(s.z - .5), sx, sx));
  robots.forEach(r => {
    mg.fillStyle = r.color; mg.beginPath(); mg.arc(X(r.pos.x), Z(r.pos.z), Math.max(3, sx * .8), 0, 7); mg.fill();
    mg.strokeStyle = r.color; mg.lineWidth = Math.max(1.5, sx * .2); mg.beginPath(); mg.moveTo(X(r.pos.x), Z(r.pos.z)); mg.lineTo(X(r.pos.x + Math.sin(r.yaw) * 1.8), Z(r.pos.z + Math.cos(r.yaw) * 1.8)); mg.stroke();
  });
  const tx = X(controls.target.x), tz = Z(controls.target.z), c = Math.max(5, sx * 1.4);
  mg.strokeStyle = 'rgba(232,238,243,.85)'; mg.lineWidth = 1.5;
  mg.beginPath(); mg.moveTo(tx - c, tz); mg.lineTo(tx + c, tz); mg.moveTo(tx, tz - c); mg.lineTo(tx, tz + c); mg.stroke();
}
mm.addEventListener('click', e => {
  const r = mm.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * 64 - 32, z = (e.clientY - r.top) / r.height * 40 - 20;
  following = null; setCamPressed('');
  const t = new THREE.Vector3(clamp(x, -31, 31), 0, clamp(z, -19, 19));
  flyTo(t.clone().add(camera.position.clone().sub(controls.target)), t, .8);
});

/* ---------- resize */
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight; if (!w || !h) return;
  renderer.setSize(w, h); labelRenderer.setSize(w, h);
  camera.aspect = w / h; camera.fov = w < 700 ? 52 : 40; camera.updateProjectionMatrix();
  sizeMinimap();
}
new ResizeObserver(resize).observe(stage); resize();

/* ================= initial working state (sample data) ================= */
bins.forEach(b => {
  if (Math.random() > .74) return;
  const p = weighted(PRODUCTS, p => p.abc === 'A' ? (b.level === 1 ? 4 : 1) : p.abc === 'C' ? (b.level === 3 ? 3 : 1) : 1.5);
  const ageRange = { A: [.2, 6], B: [1, 16], C: [3, 38] }[p.abc];
  const l = newLoad(p, randi(Math.ceil(p.cpp * .55), p.cpp), simMin - rand(...ageRange) * 1440);
  placeInBin(b, l);
});
[[0, 2.5], [5, 8]].forEach(([i, tm], k) => {
  const s = dockSpots[i], p = pickOne(PRODUCTS), l = newLoad(p, p.cpp, simMin - 3 * 1440);
  l.mesh.position.set(DOCK_X, 0, s.z); l.mesh.rotation.set(0, Math.PI / 2, 0); s.load = l; s.timer = tm; s.ref = `SO-${48208 + k}`;
});
addLog('Day shift started · 4 AGVs online', 'ship');
receiveTruck(3);
createPick(); createPick(); createPick();
refreshUI(true);
if (!reduceMotion) flyTo(ISO.p, ISO.t, 2.6);

/* ================= loop ================= */
let last = performance.now(), uiAcc = 0, colAcc = 0, mmAcc = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  const sdt = paused ? 0 : dt * speed;
  simMin += sdt / 3;                       // 1 real second = 20 simulated seconds
  autoGen(sdt); dispatch();
  robots.forEach(r => updateRobot(r, sdt));
  updateDocks(sdt, dt);

  if (fly) {
    fly.t += dt; const p = ease(Math.min(1, fly.t / fly.dur));
    camera.position.lerpVectors(fly.fromP, fly.toP, p); controls.target.lerpVectors(fly.fromT, fly.toT, p);
    if (following) { const tgt = following.pos.clone().setY(.8); fly.toT.copy(tgt); }
    if (fly.t >= fly.dur) fly = null;
  } else if (following) {
    const tgt = following.pos.clone().setY(.8), delta = tgt.sub(controls.target).multiplyScalar(Math.min(1, dt * 6));
    controls.target.add(delta); camera.position.add(delta);
  }
  controls.update();
  controls.target.set(clamp(controls.target.x, -34, 34), clamp(controls.target.y, 0, 6), clamp(controls.target.z, -22, 22));

  const tt = now / 1000, pulse = reduceMotion ? 1 : 1 + .18 * Math.sin(tt * 4);
  if (sel && sel.type === 'bin') {
    const b = sel.bin; selEdges.position.set(b.x, b.y + .9, b.z); selEdges.visible = true;
    pillar.position.set(b.x, 0, b.z); ring.position.set(b.ax + (b.x - b.ax) * .55, .04, b.z);
    pillar.visible = ring.visible = true; ring.scale.setScalar(pulse);
    pillar.material.opacity = reduceMotion ? .13 : .1 + .05 * Math.sin(tt * 3);
  } else if (sel && sel.type === 'robot') {
    selEdges.visible = pillar.visible = false; ring.visible = true; ring.position.set(sel.r.pos.x, .04, sel.r.pos.z); ring.scale.setScalar(1.2 * pulse);
  } else { selEdges.visible = pillar.visible = ring.visible = false; }

  renderer.render(scene, camera); labelRenderer.render(scene, camera);

  uiAcc += dt; if (uiAcc > .25) { uiAcc = 0; refreshUI(); }
  colAcc += dt; if (mode === 'age' && colAcc > 1) { colAcc = 0; recolorAll(); }
  mmAcc += dt; if (mmAcc > 1 / 15) { mmAcc = 0; drawMinimap(); }
  if (toastTimer > 0) { toastTimer -= dt; if (toastTimer <= 0) $('#toast').hidden = true; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
